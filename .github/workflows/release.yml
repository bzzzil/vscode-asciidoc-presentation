name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.0

      - name: Dependencies
        run: |
          npm install
          npm install -g @vscode/vsce

      - name: Test
        run: xvfb-run npm test

      - name: Package
        run: |
          npm run package
          vsce package

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
