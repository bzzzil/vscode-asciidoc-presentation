name: Release Prepare

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Semver increment type (patch, minor, major)"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Explicit version (for example 2.4.0)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-prepare-${{ github.ref }}-${{ inputs.version || inputs.release_type || 'manual' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Release prepare must run from master. Current ref: ${GITHUB_REF}";
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.0.0

      - name: Install dependencies
        run: npm install

      - name: Validate clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean before release prepare."
            git status --short
            exit 1
          fi

      - name: Resolve target version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TYPE="${{ inputs.release_type }}"
          EXPLICIT_VERSION="${{ inputs.version }}"

          if [ -n "$RELEASE_TYPE" ] && [ -n "$EXPLICIT_VERSION" ]; then
            echo "::error::Provide either release_type or version, not both."
            exit 1
          fi

          if [ -z "$RELEASE_TYPE" ] && [ -z "$EXPLICIT_VERSION" ]; then
            echo "::error::Provide one input: release_type or version."
            exit 1
          fi

          if [ -n "$EXPLICIT_VERSION" ]; then
            if ! [[ "$EXPLICIT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must match X.Y.Z"
              exit 1
            fi
            npm version "$EXPLICIT_VERSION" --no-git-tag-version
          else
            npm version "$RELEASE_TYPE" --no-git-tag-version
          fi

          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Guardrail - ensure tag does not already exist
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists in repository history."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin."
            exit 1
          fi

      - name: Guardrail - check release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG already exists and is published."
              exit 1
            fi
            echo "Draft release $TAG already exists and will be updated."
          fi

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::error::Version bump produced no file changes."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release ${{ steps.version.outputs.tag }}"

      - name: Run tests
        run: xvfb-run npm test

      - name: Build extension bundle
        run: npm run package

      - name: Build VSIX
        run: npx @vscode/vsce package

      - name: Verify VSIX filename/version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          COUNT=$(find . -maxdepth 1 -name '*.vsix' | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one VSIX artifact, found $COUNT."
            find . -maxdepth 1 -name '*.vsix' -print
            exit 1
          fi
          VSIX_FILE=$(find . -maxdepth 1 -name '*.vsix' -print | sed 's|^./||')
          if [[ "$VSIX_FILE" != *"-${VERSION}.vsix" ]]; then
            echo "::error::VSIX filename ($VSIX_FILE) does not match version $VERSION."
            exit 1
          fi
          echo "vsix_file=$VSIX_FILE" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        run: git tag "${{ steps.version.outputs.tag }}"

      - name: Push commit and tag
        run: |
          git push origin HEAD:master
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create or update draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: ${{ steps.package.outputs.vsix_file }}
          overwrite_files: true
