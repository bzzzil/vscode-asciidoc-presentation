name: NodeJS with Webpack

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.0

      - name: Dependencies
        run: 
          npm install

      - name: Test (Ubuntu)
        if: contains(matrix.os, 'ubuntu')
        run: xvfb-run npm test

      - name: Test (Win/Mac)
        if: !contains(matrix.os, 'ubuntu')
        run: npm test
