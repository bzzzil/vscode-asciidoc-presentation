name: VSIX + test

permissions:
  contents: read
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.0.0

      - name: Dependencies
        run: 
          npm install

      - name: Test (Ubuntu)
        if: contains(matrix.os, 'ubuntu')
        run: xvfb-run npm test

      - name: Test (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          rm -rf .vscode-u
          npm test

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Remove-Item -Path .vscode-u -Recurse -Force -ErrorAction SilentlyContinue
          npm test
